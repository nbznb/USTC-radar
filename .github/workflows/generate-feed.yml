name: Generate Radar Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Generate radar feed
        run: cd scripts && node generate-feed.js

      - name: Commit and push radar feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-radar.json state-feed.json
          git diff --cached --quiet || git commit -m "chore: update radar feed [skip ci]"
          git push
